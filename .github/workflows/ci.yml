name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # e2e probes a real ffmpeg/ffprobe binary; ubuntu-latest no longer ships it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
      # Catch frontend / landing compile errors that the node tests never load.
      - run: npm run build
      - run: npm run build:landing
      # Landing output is committed under docs/ for GitHub Pages: fail if it is stale.
      - name: Landing build under docs/ is committed and up to date
        run: |
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            git status --short -- docs/
            echo "::error::docs/ is stale - run 'npm run build:landing' and commit the result (delete superseded docs/vite bundles)."
            exit 1
          fi
